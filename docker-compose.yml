services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rcgpt-backend
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://rcgpt.vercel.app,http://localhost:3000}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rcgpt-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
